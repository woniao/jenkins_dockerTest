# deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  labels: { app: hello-web }
spec:
  replicas: 2                       # 2 副本，正好摊到 2nd 和 3rd
  selector:
    matchLabels: { app: hello-web }
  template:
    metadata:
      labels: { app: hello-web }
    spec:
      containers:
      - name: hello-web
        image: 192.168.126.128:5000/hello-docker:__TAG__   # 占位符，Jenkins 会替换
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web-svc
spec:
  type: NodePort
  selector: { app: hello-web }
  ports:
  - port: 80
    targetPort: 5000                # 转发到容器的 5000（Flask 监听端口）
